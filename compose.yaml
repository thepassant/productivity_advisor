services:

  postgres:
    image: postgres:17
    container_name: productivity-advisor-pg
    environment:
      POSTGRES_DB: productivity_advisor
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d productivity_advisor"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: productivity-advisor-app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: productivity_advisor
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

    ports:
      - "8000:8000"
      - "8501:8501"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: