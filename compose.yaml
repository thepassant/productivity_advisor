services:

  postgres:
    image: postgres:17
    container_name: productivity-advisor-pg

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: productivity-advisor-app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8000:8000"
      - "8501:8501"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: